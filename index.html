<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Valentine Letter</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>
         <!-- Envelope screen -->
          <div id="envelope-container">
            <img src="enve1.jpg" alt="Envelope" id="envelope">
            <p>Letter for You, Boak Boak ❤️</p>
          </div>
          <!-- Letter screen  -->
           <div id="letter-container">
            <div class="letter-window">
                <h1 id="letter-title">Will you marry me?</h1>

                <img src="minion.webp" class="minion" id="letter-minion">

                <div class="buttons" id="letter-buttons">
                    <img src="yes1.jpg" class="btn yes-btn" alt="Yes">
                    <div class="no-wrapper">
                        <img src="no2.jpg" class="btn no-btn" alt="No">
                    </div>
                </div>
                <p id="final-text" class="final-text" style="display: none;">
                    <strong>Time and Location:</strong> Beach at 7am. I love U ❤️.
                </p>
            </div>
           </div>
        <script src="script.js"></script>
    </body>
</html>
